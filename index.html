<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Design System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="Header">
        <span class="Header__brand">Basic Design System</span>
        <a class="Header__link" href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </header>

    <section class="Hero">
        <span class="Hero__tag">Basic Design System v1.0</span>
        <h1 class="Hero__title">Menos es el sistema.</h1>
        <p class="Hero__description">
            Solo tokens, tipografía monoespaciada y bordes duros — los
            componentes esenciales para construir interfaces crudas y
            honestas.
        </p>
        <a class="Hero__link" href="#">Open source ↗</a>
    </section>

    <section class="Components" id="components">
        <h2 class="Components__title">Components</h2>
        <div class="Components__grid">
            <div class="ComponentCard" data-component-name="Button" tabindex="0">
                <span class="ComponentCard__title">Button</span>
                <div class="ComponentCard__row">
                    <button class="Button">Primary</button>
                    <button class="Button Button--secondary">Secondary</button>
                    <button class="Button" disabled>Disabled</button>
                </div>
                <template class="ComponentCard__code">&lt;button class="Button"&gt;Primary&lt;/button&gt;
&lt;button class="Button Button--secondary"&gt;Secondary&lt;/button&gt;
&lt;button class="Button" disabled&gt;Disabled&lt;/button&gt;</template>
            </div>
            <div class="ComponentCard" data-component-name="Radio" tabindex="0">
                <span class="ComponentCard__title">Radio</span>
                <div class="ComponentCard__row">
                    <label class="Radio">
                        <input class="Radio__input" type="radio" name="demo-radio" checked>
                        <span class="Radio__label">Option A</span>
                    </label>
                    <label class="Radio">
                        <input class="Radio__input" type="radio" name="demo-radio">
                        <span class="Radio__label">Option B</span>
                    </label>
                    <label class="Radio">
                        <input class="Radio__input" type="radio" name="demo-radio" disabled>
                        <span class="Radio__label">Disabled</span>
                    </label>
                </div>
                <template class="ComponentCard__code">&lt;label class="Radio"&gt;
  &lt;input class="Radio__input" type="radio" name="group" checked&gt;
  &lt;span class="Radio__label"&gt;Option A&lt;/span&gt;
&lt;/label&gt;
&lt;label class="Radio"&gt;
  &lt;input class="Radio__input" type="radio" name="group"&gt;
  &lt;span class="Radio__label"&gt;Option B&lt;/span&gt;
&lt;/label&gt;
&lt;label class="Radio"&gt;
  &lt;input class="Radio__input" type="radio" name="group" disabled&gt;
  &lt;span class="Radio__label"&gt;Disabled&lt;/span&gt;
&lt;/label&gt;</template>
            </div>
            <div class="ComponentCard" data-component-name="Checkbox" tabindex="0">
                <span class="ComponentCard__title">Checkbox</span>
                <div class="ComponentCard__row">
                    <label class="Checkbox">
                        <input class="Checkbox__input" type="checkbox" checked>
                        <span class="Checkbox__label">Checked</span>
                    </label>
                    <label class="Checkbox">
                        <input class="Checkbox__input" type="checkbox">
                        <span class="Checkbox__label">Unchecked</span>
                    </label>
                    <label class="Checkbox">
                        <input class="Checkbox__input" type="checkbox" disabled>
                        <span class="Checkbox__label">Disabled</span>
                    </label>
                </div>
                <template class="ComponentCard__code">&lt;label class="Checkbox"&gt;
  &lt;input class="Checkbox__input" type="checkbox" checked&gt;
  &lt;span class="Checkbox__label"&gt;Checked&lt;/span&gt;
&lt;/label&gt;
&lt;label class="Checkbox"&gt;
  &lt;input class="Checkbox__input" type="checkbox"&gt;
  &lt;span class="Checkbox__label"&gt;Unchecked&lt;/span&gt;
&lt;/label&gt;
&lt;label class="Checkbox"&gt;
  &lt;input class="Checkbox__input" type="checkbox" disabled&gt;
  &lt;span class="Checkbox__label"&gt;Disabled&lt;/span&gt;
&lt;/label&gt;</template>
            </div>
            <div class="ComponentCard" data-component-name="Input" tabindex="0">
                <span class="ComponentCard__title">Input</span>
                <div class="ComponentCard__row">
                    <label class="Input">
                        <span class="Input__label">Name</span>
                        <input class="Input__field" type="text" placeholder="Type here">
                    </label>
                    <label class="Input">
                        <span class="Input__label">Disabled</span>
                        <input class="Input__field" type="text" placeholder="Type here" disabled>
                    </label>
                </div>
                <template class="ComponentCard__code">&lt;label class="Input"&gt;
  &lt;span class="Input__label"&gt;Name&lt;/span&gt;
  &lt;input class="Input__field" type="text" placeholder="Type here"&gt;
&lt;/label&gt;
&lt;label class="Input"&gt;
  &lt;span class="Input__label"&gt;Disabled&lt;/span&gt;
  &lt;input class="Input__field" type="text" placeholder="Type here" disabled&gt;
&lt;/label&gt;</template>
            </div>
        </div>
    </section>

    <dialog class="Modal" id="componentModal">
        <div class="Modal__header">
            <span class="Modal__title"></span>
            <button class="Modal__close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="Modal__preview"></div>
        <div class="Modal__codeWrap">
            <button class="Modal__copy" type="button">Copy</button>
            <pre class="Modal__code"><code></code></pre>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
